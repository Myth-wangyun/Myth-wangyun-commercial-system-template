[pytest]
testpaths = backend/test
python_files = test_*.py
norecursedirs =
    .git
    .venv
    node_modules
    backend/test/manual
    backend/test/puppeteer
addopts =
    -ra
    --strict-config
    --strict-markers
    --ignore=backend/test/units
    --ignore=backend/test/manual
    --ignore=backend/test/puppeteer
    --ignore=backend/test/test_all_routes.py
    --ignore=backend/test/test_api.py
    --ignore=backend/test/test_api_simple.py
    --ignore=backend/test/test_backend.py
    --ignore=backend/test/test_campus_api_final.py
    --ignore=backend/test/test_campus_aware_api.py
    --ignore=backend/test/test_delete.py
    --ignore=backend/test/test_delete_encoded.py
    --ignore=backend/test/test_delete_functions.py
    --ignore=backend/test/test_english_campus_api.py
    --ignore=backend/test/test_human_resources_dashboard_http_attached.py
    --ignore=backend/test/test_routes.py
    --ignore=backend/test/test_simple_campus_api.py
    --ignore=backend/test/test_statistics_fix.py
    --ignore=backend/test/test_statistics_order.py
markers =
    unit: fast isolated tests that must not perform real database or network I/O.
    smoke: fast import, startup, and regression checks that must stay green on every backend change.
    integration: tests that exercise multiple layers or real persistence.
    http: tests that talk to a managed backend HTTP server.
    db: tests that create, seed, or reset a test database.
asyncio_default_fixture_loop_scope = function
