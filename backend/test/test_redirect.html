<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试自动跳转功能</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .test-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .success { background: #d4edda; color: #155724; }
        .warning { background: #fff3cd; color: #856404; }
        .info { background: #d1ecf1; color: #0c5460; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #5a6fd8;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>🔐 认证跳转功能测试</h2>
        
        <div id="tokenStatus" class="status info">
            正在检查登录状态...
        </div>
        
        <div id="redirectInfo" class="status info">
            等待跳转...
        </div>
        
        <div>
            <button onclick="checkToken()">检查Token</button>
            <button onclick="clearToken()">清除Token</button>
            <button onclick="setTestToken()">设置测试Token</button>
            <button onclick="goToIndex()">访问主页面</button>
        </div>
        
        <div style="margin-top: 20px; font-size: 14px; color: #666;">
            <p><strong>测试说明：</strong></p>
            <p>1. 点击"清除Token"后，再点击"访问主页面"应该自动跳转到登录页</p>
            <p>2. 点击"设置测试Token"后，再点击"访问主页面"应该正常进入系统</p>
        </div>
    </div>

    <script>
        function checkToken() {
            const token = localStorage.getItem('access_token') || sessionStorage.getItem('access_token');
            const status = document.getElementById('tokenStatus');
            
            if (token) {
                status.className = 'status success';
                status.textContent = '✓ 检测到Token: ' + token.substring(0, 20) + '...';
            } else {
                status.className = 'status warning';
                status.textContent = '✗ 未检测到Token，将跳转到登录页面';
            }
        }
        
        function clearToken() {
            localStorage.removeItem('access_token');
            sessionStorage.removeItem('access_token');
            checkToken();
            document.getElementById('redirectInfo').textContent = 'Token已清除，访问主页面将跳转到登录页';
        }
        
        function setTestToken() {
            const testToken = 'test_token_' + Date.now();
            localStorage.setItem('access_token', testToken);
            checkToken();
            document.getElementById('redirectInfo').textContent = '测试Token已设置，访问主页面将正常进入';
        }
        
        function goToIndex() {
            document.getElementById('redirectInfo').textContent = '正在跳转到主页面...';
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        }
        
        // 页面加载时检查token状态
        window.addEventListener('load', checkToken);
    </script>
</body>
</html>
